name: Deploy GCP

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      confirm_project:
        description: Type the configured GCP project ID. Required for apply.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: takeone-gcp-production
  cancel-in-progress: false

jobs:
  infrastructure:
    environment: production
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_image: ${{ vars.TAKEONE_BACKEND_IMAGE }}
      TF_VAR_convex_url: ${{ vars.CONVEX_URL }}
      TF_VAR_dispatch_secret_id: ${{ vars.DISPATCH_SECRET_ID }}
      TF_VAR_worker_secrets: ${{ secrets.TF_WORKER_SECRETS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment inputs
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: node scripts/deployment-preflight.mjs
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - name: Initialize remote state
        env:
          TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        run: terraform -chdir=infra init -backend-config="bucket=$TERRAFORM_STATE_BUCKET" -backend-config="prefix=takeone/production"
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra validate
      - name: Plan exact project
        run: terraform -chdir=infra plan -out=deployment.tfplan
      - name: Apply reviewed plan
        if: inputs.action == 'apply'
        run: terraform -chdir=infra apply -auto-approve deployment.tfplan
